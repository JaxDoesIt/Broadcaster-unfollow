name: Build MCGateway Immutable Image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Official MCXboxBroadcast release tag to build. Leave blank for latest.
        required: false
        type: string
        default: ""
      force_rebuild:
        description: Deprecated safety input; immutable image overwrite is refused
        required: false
        type: boolean
        default: false
      image_variant:
        description: Validated MCGateway overlay/image variant
        required: false
        type: string
        default: "unfollow-v11"

concurrency:
  group: mcgateway-immutable-image-${{ inputs.release_tag || 'latest' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jaxdoesit/mcgateway-broadcast
  PATCH_REPOSITORY: JaxDoesIt/Broadcaster-unfollow
  PATCH_BRANCH: mcgateway/reliability-v11
  PATCH_SCRIPT: tools/apply_mcgateway_friend_patch.py
  OVERLAY_VALIDATED_RELEASE: "154"
  OVERLAY_IMAGE_VARIANT: "unfollow-v11"

jobs:
  build-release-image:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact official release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ inputs.release_tag }}
          INPUT_IMAGE_VARIANT: ${{ inputs.image_variant }}
        run: |
          set -euo pipefail

          REQUESTED="$(printf '%s' "${REQUESTED_RELEASE:-}" | xargs)"
          if [[ -n "$REQUESTED" ]]; then
            API_URL="https://api.github.com/repos/MCXboxBroadcast/Broadcaster/releases/tags/${REQUESTED}"
          else
            API_URL="https://api.github.com/repos/MCXboxBroadcast/Broadcaster/releases/latest"
          fi

          RELEASE_JSON="$(
            curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL"
          )"

          RELEASE_TAG="$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name // empty')"
          RELEASE_NAME="$(printf '%s' "$RELEASE_JSON" | jq -r '.name // empty')"
          RELEASE_BODY="$(printf '%s' "$RELEASE_JSON" | jq -r '.body // empty')"
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "Could not determine the official release tag."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "$OVERLAY_VALIDATED_RELEASE" ]]; then
            echo "Refusing to apply the MCGateway reliability overlay to unvalidated release $RELEASE_TAG."
            echo "Validated release: $OVERLAY_VALIDATED_RELEASE"
            exit 1
          fi
          if [[ "${{ inputs.force_rebuild }}" == "true" ]]; then
            echo "Refusing force_rebuild: immutable image tags are write-once. Use a new image_variant."
            exit 1
          fi

          SAFE_TAG="$(printf '%s' "$RELEASE_TAG" | sed 's/[^A-Za-z0-9_.-]/-/g')"
          BUILD_NUMBER="$(printf '%s' "$RELEASE_TAG" | grep -oE '[0-9]+' | tail -n 1 || true)"
          if [[ -z "$BUILD_NUMBER" ]]; then
            echo "Could not determine a numeric build number from: $RELEASE_TAG"
            exit 1
          fi

          TARGET_MINECRAFT="$(printf '%s\n%s\n' "$RELEASE_NAME" "$RELEASE_BODY" | grep -oE '\b(1\.)?26\.[0-9]{1,3}(\.[0-9]{1,3})?\b' | head -n 1 | sed 's/^1\.//' || true)"
          REQUESTED_VARIANT="$(printf '%s' "${INPUT_IMAGE_VARIANT:-}" | xargs)"
          if [[ "$REQUESTED_VARIANT" != "$OVERLAY_IMAGE_VARIANT" ]]; then
            echo "Refusing unknown image variant: $REQUESTED_VARIANT"
            exit 1
          fi
          IMMUTABLE_TAG="${IMAGE}:release-${SAFE_TAG}-${OVERLAY_IMAGE_VARIANT}"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "safe_tag=$SAFE_TAG" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "target_minecraft=$TARGET_MINECRAFT" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=$IMMUTABLE_TAG" >> "$GITHUB_OUTPUT"
          echo "IMMUTABLE_TAG=$IMMUTABLE_TAG" >> "$GITHUB_ENV"

          echo "Official release: $RELEASE_TAG"
          echo "Target Minecraft: ${TARGET_MINECRAFT:-unknown}"
          echo "Immutable image: $IMMUTABLE_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable image
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMMUTABLE_TAG" >/dev/null 2>&1
          then
            echo "Immutable image already exists. Nothing will be rebuilt or retagged."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download exact official release source
        if: steps.existing.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          repository: MCXboxBroadcast/Broadcaster
          ref: ${{ steps.release.outputs.release_tag }}
          fetch-depth: 0

      - name: Apply bounded MCGateway reliability overlay
        if: steps.existing.outputs.skip != 'true'
        id: patch
        shell: bash
        run: |
          set -euo pipefail

          LOGGER_FILE="bootstrap/standalone/src/main/java/com/rtm516/mcxboxbroadcast/bootstrap/standalone/StandaloneLoggerImpl.java"
          FRIEND_FILE="core/src/main/java/com/rtm516/mcxboxbroadcast/core/FriendManager.java"
          SESSION_FILE="core/src/main/java/com/rtm516/mcxboxbroadcast/core/SessionManager.java"
          SESSION_CORE_FILE="core/src/main/java/com/rtm516/mcxboxbroadcast/core/SessionManagerCore.java"
          REDIRECT_FILE="core/src/main/java/com/rtm516/mcxboxbroadcast/core/nethernet/RedirectPacketHandler.java"
          if grep -Fq 'friends remove <xuid>' "$LOGGER_FILE" \
            && grep -Fq 'removeRelationship(String xuid)' "$FRIEND_FILE" \
            && grep -Fq 'Friends:' "$SESSION_FILE" \
            && grep -Fq 'MCGATEWAY_JOIN_ATTEMPT_V1' "$SESSION_FILE" \
            && grep -Fq 'MCGATEWAY_TRANSFER_SUCCESS_V1' "$REDIRECT_FILE" \
            && grep -Fq 'MCGATEWAY_HEALTH_V1' "$SESSION_CORE_FILE"
          then
            echo "Official release already contains friend-removal support."
            echo "patch_mode=upstream" >> "$GITHUB_OUTPUT"
          else
            git remote add mcgateway-patch "https://github.com/${PATCH_REPOSITORY}.git"
            git fetch --no-tags mcgateway-patch "${PATCH_BRANCH}"
            git show "mcgateway-patch/${PATCH_BRANCH}:${PATCH_SCRIPT}" > /tmp/apply_mcgateway_friend_patch.py
            python3 /tmp/apply_mcgateway_friend_patch.py .
            echo "patch_mode=semantic-overlay" >> "$GITHUB_OUTPUT"
          fi

          git diff --check
          grep -Fq 'friends remove <xuid>' "$LOGGER_FILE"
          grep -Fq 'case "health"' "$LOGGER_FILE"
          grep -Fq 'removeRelationship(String xuid)' "$FRIEND_FILE"
          grep -Fq 'SocialCounts socialCounts()' "$FRIEND_FILE"
          grep -Fq 'MCGATEWAY_JOIN_ATTEMPT_V1' "$SESSION_FILE"
          grep -Fq 'MCGATEWAY_TRANSFER_SUCCESS_V1' "$REDIRECT_FILE"
          grep -Fq 'MCGATEWAY_HEALTH_V1' "$SESSION_CORE_FILE"
          grep -Fq 'friends/v2/xuid(" + xuid + ")' "$FRIEND_FILE"
          grep -Fq 'friendRequestAcceptResponse.isFriend' "$FRIEND_FILE"
          ! grep -Fq 'bulk/users/me/people/friends/v2?method=add' "$FRIEND_FILE"

      - name: Set up Java 17
        if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        if: steps.existing.outputs.skip != 'true'
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Gradle
        if: steps.existing.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Build patched Standalone JAR
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew build
          JAR="bootstrap/standalone/build/libs/MCXboxBroadcastStandalone.jar"
          [[ -s "$JAR" ]] || { echo "Standalone JAR was not created."; exit 1; }
          jar tf "$JAR" >/dev/null

      - name: Build and publish immutable image
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bootstrap/standalone/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMMUTABLE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/JaxDoesIt/Broadcaster-unfollow
            org.opencontainers.image.description=MCXboxBroadcast with bounded MCGateway reliability overlay
            io.mcgateway.upstream-release=${{ steps.release.outputs.release_tag }}
            io.mcgateway.overlay-variant=${{ inputs.image_variant }}
            io.mcgateway.patch-mode=${{ steps.patch.outputs.patch_mode }}
            io.mcgateway.target-minecraft=${{ steps.release.outputs.target_minecraft }}

      - name: Verify immutable image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMMUTABLE_TAG"
          echo "Build complete. No live test/stable channel tag was changed."
