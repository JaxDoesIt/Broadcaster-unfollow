name: Release160 V4 exact HTTP-code diagnostic source proof (offline)

on:
  push:
    branches:
      - fix/release160-friendlist-http-code-v4-2026-10-30
    paths:
      - 'tools/release160/McgatewayXboxPersonSummaryProbeV160.java'
      - 'tools/release160/McgatewayXboxPersonSummaryProbeV160Test.java'
      - 'tools/release160/apply_personsummary_canary.py'
      - 'tools/release160/test_apply_personsummary_canary.py'
      - 'tools/release160/apply_readonly_friendcache_canary.py'
      - 'tools/release160/test_apply_readonly_friendcache_canary.py'
      - 'tools/release160/McgatewayXboxFriendListStatusV160.java'
      - 'tools/release160/McgatewayXboxFriendListStatusV160Test.java'
      - 'tools/release160/apply_friendlist_status_v3.py'
      - 'tools/release160/test_apply_friendlist_status_v3.py'
      - 'tools/release160/personsummary_console_result.py'
      - 'tools/release160/test_personsummary_console_result.py'
      - '.github/workflows/release160-friendlist-http-code-v4-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-nonmutating-canary-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UPSTREAM_SHA: 798d8b3a6107359643b525f1c9c3303c020ae09b
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MCXboxBroadcast/Broadcaster
          ref: 798d8b3a6107359643b525f1c9c3303c020ae09b
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: overlay
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify original live-variant source and apply GET-only addition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
          # Exact historical relay-audit-expiry-held-v2 overlay inputs.
          test "$(git -C overlay hash-object tools/apply_mcgateway_release160_patch.py)" = "f4114376354b18e3b7541aa4af8bc6103b3b3b53"
          test "$(git -C overlay hash-object tools/test_release160_patch.py)" = "b5cfd61bd0e21434504eeb4a67f86e2a7e13a280"
          test "$(git -C overlay hash-object tools/release160/config-proof.gradle.kts)" = "b76d20e5603ad1eb212fd913ce17e861862c3853"
          # Exact reviewed GET-only canary helper and safety harness.
          test "$(git -C overlay hash-object tools/release160/McgatewayXboxPersonSummaryProbeV160.java)" = "540071e207b7f57f4bdbf3dbb216e716a2111fce"
          test "$(git -C overlay hash-object tools/release160/McgatewayXboxPersonSummaryProbeV160Test.java)" = "9ea37126bb135553fcd57d9ecffa308cc5e8bd17"
          test "$(git -C overlay hash-object tools/release160/apply_personsummary_canary.py)" = "8492f7a81fd93bc9809b7cb618110750e20502aa"
          test "$(git -C overlay hash-object tools/release160/test_apply_personsummary_canary.py)" = "92fba7b20fbe9bc5320c933c2923ae080f6db40e"
          test "$(git -C overlay hash-object tools/release160/apply_readonly_friendcache_canary.py)" = "19f41e34185ed069105fb550cae37e6c309eead1"
          test "$(git -C overlay hash-object tools/release160/test_apply_readonly_friendcache_canary.py)" = "ac68e848d76b642ab289cc3cad7523a70c5a90c7"
          test "$(git -C overlay hash-object tools/release160/McgatewayXboxFriendListStatusV160.java)" = "348d8891e0a8c0f1fef57aee993cd44c49a91043"
          test "$(git -C overlay hash-object tools/release160/McgatewayXboxFriendListStatusV160Test.java)" = "dc156c5494379ab26b6f907324df443f46998b89"
          test "$(git -C overlay hash-object tools/release160/apply_friendlist_status_v3.py)" = "41b0c942cebc211f5318c51c9008aae902c3984d"
          test "$(git -C overlay hash-object tools/release160/test_apply_friendlist_status_v3.py)" = "04c565418e4d5fba08ed1883b987be2709771d04"
          test "$(git -C overlay hash-object tools/release160/personsummary_console_result.py)" = "83f13f7d2079b7a1f2ced03c04d27c4f52ab3000"
          test "$(git -C overlay hash-object tools/release160/test_personsummary_console_result.py)" = "5a239a98166dd451b8b8d585c833343ae32dfe2f"
          # This MUST be the old relay-audit-expiry-held-v2 overlay,
          # not the experimental friend-count-v3/presence-retry candidate.
          ! grep -Fq 'MCGATEWAY_XBOX_PRESENCE_POST_ACCEPTED' overlay/tools/apply_mcgateway_release160_patch.py
          python3 -B overlay/tools/test_release160_patch.py upstream
          python3 -B overlay/tools/apply_mcgateway_release160_patch.py upstream
          PYTHONDONTWRITEBYTECODE=1 python3 -B overlay/tools/release160/test_apply_personsummary_canary.py
          python3 -B overlay/tools/release160/apply_personsummary_canary.py upstream \
            overlay/tools/release160/McgatewayXboxPersonSummaryProbeV160.java
          PYTHONDONTWRITEBYTECODE=1 python3 -B overlay/tools/release160/test_apply_readonly_friendcache_canary.py
          python3 -B overlay/tools/release160/apply_readonly_friendcache_canary.py upstream
          PYTHONDONTWRITEBYTECODE=1 python3 -B overlay/tools/release160/test_apply_friendlist_status_v3.py
          python3 -B overlay/tools/release160/apply_friendlist_status_v3.py upstream \
            overlay/tools/release160/McgatewayXboxFriendListStatusV160.java
          PYTHONDONTWRITEBYTECODE=1 python3 -B overlay/tools/release160/test_personsummary_console_result.py
          # The candidate must not execute automatic add/remove, pending
          # acceptance or periodic friend-sync mutation paths.
          grep -Fq 'MCGATEWAY_PERSONSUMMARY_READONLY_CACHE_V2' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/FriendManager.java
          grep -Fq 'MCGATEWAY_FRIEND_LIST_HTTP_STATUS_V3' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/FriendManager.java
          grep -Fq 'MCGATEWAY_FRIEND_LIST_EXACT_HTTP_V4' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/McgatewayXboxFriendListStatusV160.java
          ! grep -Fq 'snapshot = get()' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/FriendManager.java
          grep -Fq 'McgatewayXboxFriendListStatusV160.capture(' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/FriendManager.java
          mkdir -p upstream/core/src/mcgatewayProof/java/com/rtm516/mcxboxbroadcast/core
          cp overlay/tools/release160/McgatewayXboxPersonSummaryProbeV160Test.java \
             upstream/core/src/mcgatewayProof/java/com/rtm516/mcxboxbroadcast/core/
          cp overlay/tools/release160/McgatewayXboxFriendListStatusV160Test.java \
             upstream/core/src/mcgatewayProof/java/com/rtm516/mcxboxbroadcast/core/
          cat overlay/tools/release160/config-proof.gradle.kts >> upstream/core/build.gradle.kts
          cat >> upstream/core/build.gradle.kts <<'EOF'
          tasks.register<JavaExec>("mcgatewayPersonSummaryProbeProof") {
              dependsOn(mcgatewayProof.classesTaskName)
              classpath = mcgatewayProof.runtimeClasspath
              mainClass.set("com.rtm516.mcxboxbroadcast.core.McgatewayXboxPersonSummaryProbeV160Test")
              maxHeapSize = "128m"
          }
          tasks.register<JavaExec>("mcgatewayFriendListStatusProof") {
              dependsOn(mcgatewayProof.classesTaskName)
              classpath = mcgatewayProof.runtimeClasspath
              mainClass.set("com.rtm516.mcxboxbroadcast.core.McgatewayXboxFriendListStatusV160Test")
              maxHeapSize = "128m"
          }
          EOF
          git -C upstream diff --check
          grep -Fq 'MCGATEWAY_RELEASE160_EXPIRY_HOLD' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/SessionManager.java
          grep -Fq 'friends remove is DENIED' upstream/bootstrap/standalone/src/main/java/com/rtm516/mcxboxbroadcast/bootstrap/standalone/StandaloneLoggerImpl.java
          grep -Fq 'case "personsummaryprobe" ->' upstream/bootstrap/standalone/src/main/java/com/rtm516/mcxboxbroadcast/bootstrap/standalone/StandaloneLoggerImpl.java
          ! grep -Fq 'MCGATEWAY_XBOX_PRESENCE_POST_ACCEPTED' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/SessionManagerCore.java
          ! grep -Fq 'friendcountv2' upstream/bootstrap/standalone/src/main/java/com/rtm516/mcxboxbroadcast/bootstrap/standalone/StandaloneLoggerImpl.java
      - name: Compile original baseline with GET-only canary and execute mocked tests
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g \
            :core:mcgatewayPersonSummaryProbeProof \
            :core:mcgatewayFriendListStatusProof \
            :bootstrap-standalone:classes
      - name: Build standalone canary JAR without publishing an image
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g \
            :bootstrap-standalone:build
          JAR="bootstrap/standalone/build/libs/MCXboxBroadcastStandalone.jar"
          test -s "$JAR"
          jar tf "$JAR" > "$RUNNER_TEMP/release160-canary-jar-entries.txt"
          grep -Fqx 'com/rtm516/mcxboxbroadcast/core/McgatewayXboxPersonSummaryProbeV160.class' \
            "$RUNNER_TEMP/release160-canary-jar-entries.txt"
          grep -Fqx 'com/rtm516/mcxboxbroadcast/core/McgatewayXboxFriendListStatusV160.class' \
            "$RUNNER_TEMP/release160-canary-jar-entries.txt"
          grep -Fqx 'com/rtm516/mcxboxbroadcast/bootstrap/standalone/StandaloneLoggerImpl.class' \
            "$RUNNER_TEMP/release160-canary-jar-entries.txt"
          sha256sum "$JAR" > "$JAR.sha256"
          echo "Standalone canary JAR verified; no container build or live action."
      - name: Upload standalone canary JAR and checksum (not a Docker image)
        uses: actions/upload-artifact@v4
        with:
          name: release160-friendlist-http-code-v4-proof-jar
          path: |
            upstream/bootstrap/standalone/build/libs/MCXboxBroadcastStandalone.jar
            upstream/bootstrap/standalone/build/libs/MCXboxBroadcastStandalone.jar.sha256
          if-no-files-found: error
          retention-days: 3
      - name: Verify nonmutating friend operation gates and no image publication
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq '.DELETE()' overlay/tools/release160/McgatewayXboxPersonSummaryProbeV160.java
          ! grep -Eq '\.(DELETE|PUT|POST)\(' overlay/tools/release160/McgatewayXboxFriendListStatusV160.java
          ! grep -Fq 'new McgatewayFriendRemoveV160' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/FriendManager.java
          ! grep -Fq 'friendremovev160' upstream/bootstrap/standalone/src/main/java/com/rtm516/mcxboxbroadcast/bootstrap/standalone/StandaloneLoggerImpl.java
          grep -Fq 'can_authorize_removal=false' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/McgatewayXboxPersonSummaryProbeV160.java
          # Source proof of final gate placements; no runtime mutation.
          grep -Fq 'if (mcgPersonSummaryReadonlyCandidate()) return;' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/FriendManager.java
          grep -Fq 'if (mcgPersonSummaryReadonlyCandidate()) return false;' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/FriendManager.java
          grep -Fq 'if (mcgPersonSummaryReadonlyCandidate()) throw new IllegalStateException' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/FriendManager.java
          test "$(grep -Fc 'MCGATEWAY_FRIEND_LIST_HTTP_STATUS_V3' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/FriendManager.java)" = 1
          echo 'V4 SOURCE PROOF ONLY: no Docker, GHCR, Dell, Xbox or production actions.'
