name: Set MCGateway Image Channel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable MCXboxBroadcast release to point the channel at
        required: true
        type: string
      channel:
        description: Live channel to change
        required: true
        type: choice
        options:
          - test
          - stable
          - both

concurrency:
  group: mcgateway-channel-change
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jaxdoesit/mcgateway-broadcast

jobs:
  set-channel:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image
        id: image
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          RELEASE="$(printf '%s' "$RELEASE_TAG" | xargs)"
          [[ -n "$RELEASE" ]] || { echo "release_tag is blank"; exit 1; }
          SAFE_TAG="$(printf '%s' "$RELEASE" | sed 's/[^A-Za-z0-9_.-]/-/g')"
          IMMUTABLE_TAG="${IMAGE}:release-${SAFE_TAG}-unfollow"
          docker buildx imagetools inspect "$IMMUTABLE_TAG" >/dev/null
          echo "immutable_tag=$IMMUTABLE_TAG" >> "$GITHUB_OUTPUT"

      - name: Point requested channel to immutable release
        shell: bash
        env:
          IMMUTABLE_TAG: ${{ steps.image.outputs.immutable_tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            test)
              docker buildx imagetools create --tag "${IMAGE}:test" "$IMMUTABLE_TAG"
              ;;
            stable)
              docker buildx imagetools create --tag "${IMAGE}:stable" "$IMMUTABLE_TAG"
              ;;
            both)
              docker buildx imagetools create --tag "${IMAGE}:test" "$IMMUTABLE_TAG"
              docker buildx imagetools create --tag "${IMAGE}:stable" "$IMMUTABLE_TAG"
              ;;
            *)
              echo "Unsupported channel: $CHANNEL"
              exit 1
              ;;
          esac

      - name: Verify requested channel
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "test" || "$CHANNEL" == "both" ]]; then
            docker buildx imagetools inspect "${IMAGE}:test" >/dev/null
          fi
          if [[ "$CHANNEL" == "stable" || "$CHANNEL" == "both" ]]; then
            docker buildx imagetools inspect "${IMAGE}:stable" >/dev/null
          fi
          echo "Requested channel change completed."
