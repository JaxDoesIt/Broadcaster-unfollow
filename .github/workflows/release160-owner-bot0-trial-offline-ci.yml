name: Release160 owner Bot0 one-shot canary runner (mock-only safety)

on:
  push:
    branches:
      - build/release160-personsummary-canary-2026-10-30
    paths:
      - 'tools/release160/owner_bot0_personsummary_trial.py'
      - 'tools/release160/test_owner_bot0_personsummary_trial.py'
      - 'tools/release160/personsummary_console_result.py'
      - 'tools/release160/test_personsummary_console_result.py'
      - '.github/workflows/release160-owner-bot0-trial-offline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run-tests-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax and run simulated unit tests only
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tools/release160/owner_bot0_personsummary_trial.py \
            tools/release160/test_owner_bot0_personsummary_trial.py \
            tools/release160/personsummary_console_result.py \
            tools/release160/test_personsummary_console_result.py
          python3 -B tools/release160/test_personsummary_console_result.py
          python3 -B tools/release160/test_owner_bot0_personsummary_trial.py
          sha256sum tools/release160/owner_bot0_personsummary_trial.py tools/release160/personsummary_console_result.py
          echo 'PASS: MOCK-ONLY TESTS, no production connections, Docker changes or Xbox requests.'
