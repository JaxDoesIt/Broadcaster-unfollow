name: Build immutable Release160 reviewed-removal recovery candidate
on:
  push:
    branches: [fix/release160-friend-removal-one-shot-2026-11-02]
    paths:
      - tools/apply_mcgateway_release160_patch.py
      - tools/test_release160_patch.py
      - .github/workflows/release160-reviewed-removal-recovery-image.yml
      - tools/release160/**
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: mcgateway-release160-reviewed-removal-recovery
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/jaxdoesit/mcgateway-broadcast:release-160-reviewed-removal-recovery-${{ github.sha }}
      BUILD_NUMBER: "160"
      UPSTREAM_SHA: 798d8b3a6107359643b525f1c9c3303c020ae09b
    steps:
      - uses: actions/checkout@v6
        with:
          repository: MCXboxBroadcast/Broadcaster
          ref: 798d8b3a6107359643b525f1c9c3303c020ae09b
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: overlay
          persist-credentials: false
      - name: Validate exact source and apply separate overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
          python3 overlay/tools/test_release160_patch.py upstream
          python3 overlay/tools/apply_mcgateway_release160_patch.py upstream
          mkdir -p upstream/core/src/mcgatewayProof/java/com/rtm516/mcxboxbroadcast/core/configs
          cp overlay/tools/release160/ConfigCompatibilityProof.java upstream/core/src/mcgatewayProof/java/com/rtm516/mcxboxbroadcast/core/configs/
          mkdir -p upstream/core/src/mcgatewayProof/java/com/rtm516/mcxboxbroadcast/core
          cp overlay/tools/release160/FriendCountProofTest.java upstream/core/src/mcgatewayProof/java/com/rtm516/mcxboxbroadcast/core/
          cp overlay/tools/release160/FriendRemovalCompatProofTest.java upstream/core/src/mcgatewayProof/java/com/rtm516/mcxboxbroadcast/core/
          cat overlay/tools/release160/config-proof.gradle.kts >> upstream/core/build.gradle.kts
          git -C upstream diff --check
          test -f upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/nethernet/HttpRelaySignaling.java
          ! grep -R -q 'MCGATEWAY_TRANSFER_SUCCESS_V1' upstream/core/src/main/java
          grep -q 'MCGATEWAY_RELEASE160_EXPIRY_HOLD' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/SessionManager.java
          grep -Fq 'HttpClient.Version.HTTP_1_1' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/FriendManager.java
          grep -Fq 'buildUpstreamCompatibleRequest' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/McgatewayFriendCountProof.java
          grep -Fq 'safeFailureFields' upstream/bootstrap/standalone/src/main/java/com/rtm516/mcxboxbroadcast/bootstrap/standalone/StandaloneLoggerImpl.java
          grep -Fq 'summary-before' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/McgatewayFriendCountProof.java
          grep -Fq 'stage=other category=unclassified' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/McgatewayFriendCountProof.java
          grep -Fq 'reason instanceof ExecutionException' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/McgatewayFriendCountProof.java
          grep -Fq 'new StageFailure("friends-fetch"' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/McgatewayFriendCountProof.java
          grep -Fq 'new StageFailure("friends-validate"' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/McgatewayFriendCountProof.java
          grep -Fq 'runtime-state-unavailable' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/McgatewayFriendCountProof.java
          grep -Fq 'request-invalid' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/McgatewayFriendCountProof.java
          grep -Fq 'invalid-utf8' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/McgatewayFriendCountProof.java
          grep -Fq 'statusFirstBodyHandler(sub)' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/McgatewayFriendCountProof.java
          grep -Fq 'HttpResponse.BodySubscribers.replacing("")' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/McgatewayFriendCountProof.java
          grep -Fq 'statusFirstResponseHandler();' upstream/core/src/mcgatewayProof/java/com/rtm516/mcxboxbroadcast/core/FriendCountProofTest.java
          grep -Fq 'MCGATEWAY_RELEASE160_FRIEND_REMOVAL_MODE' upstream/bootstrap/standalone/src/main/java/com/rtm516/mcxboxbroadcast/bootstrap/standalone/StandaloneLoggerImpl.java
          grep -Fq 'friends remove is DENIED' upstream/bootstrap/standalone/src/main/java/com/rtm516/mcxboxbroadcast/bootstrap/standalone/StandaloneLoggerImpl.java
          grep -Fq 'HttpResponse.BodyHandlers.discarding()' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/FriendManager.java
          ! grep -F -q 'scheduleWithFixedDelay(this::expireFriends' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/SessionManager.java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v5
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile and test on GitHub
        working-directory: upstream
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g build :core:mcgatewayConfigCompatibility :core:mcgatewayFriendCountProof :core:mcgatewayFriendRemovalCompatibility
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse immutable candidate overwrite
        shell: bash
        run: |
          set -euo pipefail
          if docker manifest inspect "$IMAGE" >/tmp/manifest.out 2>/tmp/manifest.err; then
            echo 'Candidate already exists. Use a new reviewed candidate tag; no overwrite.'
            exit 1
          else
            if ! grep -Eiq 'manifest unknown|no such manifest' /tmp/manifest.err; then
              echo 'Registry lookup failed without proving the candidate tag absent.'
              exit 1
            fi
          fi
      - uses: docker/build-push-action@v7
        id: candidate_image
        with:
          context: upstream
          file: upstream/bootstrap/standalone/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/JaxDoesIt/Broadcaster-unfollow
            org.opencontainers.image.revision=${{ github.sha }}
            io.mcgateway.upstream-release=160
            io.mcgateway.upstream-sha=798d8b3a6107359643b525f1c9c3303c020ae09b
            io.mcgateway.overlay-variant=reviewed-removal-status-first-v1
            io.mcgateway.friend-count-protocol=2
            io.mcgateway.friend-count-envelope=upstream160-http11-no-redirect
            io.mcgateway.friend-count-error-schema=fixed-stage-category-v3
            io.mcgateway.friend-removal-protocol=reviewed-once-operator-gated
            io.mcgateway.production-ready=false
            io.mcgateway.friend-removal-default-enabled=false
            io.mcgateway.cleanup-automatically-enabled=false
            io.mcgateway.target-minecraft=26.60
      - name: Record candidate identity
        env:
          IMAGE_DIGEST: ${{ steps.candidate_image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$IMAGE_DIGEST"
          python3 - <<'PYPROOF'
          import json, os, re
          from pathlib import Path
          digest=os.environ['IMAGE_DIGEST']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}',digest)
          proof={'format':'mcgateway-release160-reviewed-removal-recovery-candidate-v1','producerSourceCommit':os.environ['GITHUB_SHA'],
                 'upstreamSourceCommit':os.environ['UPSTREAM_SHA'],'image':os.environ['IMAGE'],
                 'digest':digest,'countProtocol':2,'requestTransport':'http11-no-redirect','cleanupSupported':False,'productionReady':False,
                 'javaCountFixtures':'passed','removalFixtures':'passed','removalDefaultEnabled':False,'errorSchema':'fixed-stage-category-v3'}
          Path('candidate-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          PYPROOF
          echo 'Candidate only: test/stable tags and live bots were not changed.'
      - uses: actions/upload-artifact@v4
        with:
          name: release160-reviewed-removal-recovery-candidate-proof
          path: candidate-proof.json
          retention-days: 30
