name: Verify immutable Release160 reviewed-removal recovery candidate (offline)

on:
  push:
    branches: [fix/release160-friend-removal-one-shot-2026-11-02]
    paths:
      - .github/workflows/release160-reviewed-removal-provenance.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify-published-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      IMAGE: ghcr.io/jaxdoesit/mcgateway-broadcast@sha256:c9d076a4144bac1ab542a436aac19d5027763107adc59bcf2336233fe75429c6
      PINNED_INDEX: sha256:c9d076a4144bac1ab542a436aac19d5027763107adc59bcf2336233fe75429c6
      PINNED_MANIFEST: sha256:782de64eca45ff60f16941c52e066bb40e8c44f9095975ac1ddb55b9949e5b0c
      PINNED_CONFIG: sha256:9d4bce3c4bc59d73b7d91df1b3e0b9b9dd108d21bf6f441b9ab21f2c8f402d2b
      PRODUCER_SHA: 2a5d097c124f151ba23303f72cc60d96fc89b3cb
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read OCI index and AMD64 manifest without executing image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE" > "$RUNNER_TEMP/oci-index.json"
          docker buildx imagetools inspect --raw "ghcr.io/jaxdoesit/mcgateway-broadcast@$PINNED_MANIFEST" > "$RUNNER_TEMP/oci-manifest.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          index=json.loads((root/'oci-index.json').read_text())
          amd64=[m for m in index['manifests'] if m.get('platform',{}).get('os')=='linux' and m.get('platform',{}).get('architecture')=='amd64']
          assert len(amd64)==1 and amd64[0]['digest']==os.environ['PINNED_MANIFEST']
          assert index['mediaType']=='application/vnd.oci.image.index.v1+json'
          manifest=json.loads((root/'oci-manifest.json').read_text())
          assert manifest['mediaType']=='application/vnd.oci.image.manifest.v1+json'
          assert manifest['config']['digest']==os.environ['PINNED_CONFIG']
          assert len(manifest.get('layers',[]))>0
          print('Exact published OCI index, AMD64 manifest and config link: VERIFIED')
          PY
      - name: Inspect published immutable container labels without execution
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE" >/dev/null
          docker image inspect "$IMAGE" > "$RUNNER_TEMP/image-inspect.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          images=json.loads((Path(os.environ['RUNNER_TEMP'])/'image-inspect.json').read_text())
          assert len(images)==1
          image=images[0]
          assert image['Os']=='linux' and image['Architecture']=='amd64'
          assert image['Id'] in (os.environ['PINNED_CONFIG'],os.environ['PINNED_INDEX'])
          assert os.environ['IMAGE'] in image['RepoDigests']
          labels=image['Config']['Labels']
          expected={
            'org.opencontainers.image.revision':os.environ['PRODUCER_SHA'],
            'io.mcgateway.upstream-release':'160',
            'io.mcgateway.upstream-sha':'798d8b3a6107359643b525f1c9c3303c020ae09b',
            'io.mcgateway.overlay-variant':'reviewed-removal-status-first-v1',
            'io.mcgateway.friend-count-protocol':'2',
            'io.mcgateway.friend-count-envelope':'upstream160-http11-no-redirect',
            'io.mcgateway.friend-count-error-schema':'fixed-stage-category-v3',
            'io.mcgateway.friend-removal-protocol':'reviewed-once-operator-gated',
            'io.mcgateway.friend-removal-default-enabled':'false',
            'io.mcgateway.cleanup-automatically-enabled':'false',
            'io.mcgateway.production-ready':'false',
            'io.mcgateway.target-minecraft':'26.60'
          }
          assert all(labels.get(k)==v for k,v in expected.items())
          print('Published linux/amd64 config ID, digest and nonproduction labels: VERIFIED')
          receipt={
            'format':'mcgateway-release160-producer-image-attestation-v1',
            'sourceCommit':os.environ['PRODUCER_SHA'],
            'ociIndex':os.environ['PINNED_INDEX'],
            'amd64Manifest':os.environ['PINNED_MANIFEST'],
            'configId':os.environ['PINNED_CONFIG'],
            'labelsVerified':True,
            'countObservationOnly':True,
            'friendRemovalSupported':False,
            'productionReady':False
          }
          Path('provenance-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release160-reviewed-removal-published-provenance
          path: provenance-receipt.json
          retention-days: 30
      - name: No host or stable channel changed
        run: echo 'Verified only published candidate digests and labels. No Xbox requests, Dell, bot, stable tag, or cleanup changes.'
