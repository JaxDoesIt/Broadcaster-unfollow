name: Release160 in-process PersonSummary GET probe source-only CI

on:
  push:
    branches:
      - fix/release160-friend-removal-contract-2026-10-30
    paths:
      - 'tools/release160/McgatewayXboxPersonSummaryProbeV160.java'
      - 'tools/release160/McgatewayXboxPersonSummaryProbeV160Test.java'
      - '.github/workflows/release160-personsummary-get-probe-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-upstream-offline-compile-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UPSTREAM_SHA: 798d8b3a6107359643b525f1c9c3303c020ae09b
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MCXboxBroadcast/Broadcaster
          ref: 798d8b3a6107359643b525f1c9c3303c020ae09b
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: overlay
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Patch pinned upstream only and stage isolated GET helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
          python3 -B overlay/tools/test_release160_patch.py upstream
          python3 -B overlay/tools/apply_mcgateway_release160_patch.py upstream
          test -s overlay/tools/release160/McgatewayXboxPersonSummaryProbeV160.java
          test -s overlay/tools/release160/McgatewayXboxPersonSummaryProbeV160Test.java
          cp overlay/tools/release160/McgatewayXboxPersonSummaryProbeV160.java \
             upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/
          mkdir -p upstream/core/src/mcgatewayProof/java/com/rtm516/mcxboxbroadcast/core
          cp overlay/tools/release160/McgatewayXboxPersonSummaryProbeV160Test.java \
             upstream/core/src/mcgatewayProof/java/com/rtm516/mcxboxbroadcast/core/
          cat overlay/tools/release160/config-proof.gradle.kts >> upstream/core/build.gradle.kts
          cat >> upstream/core/build.gradle.kts <<'EOF'
          tasks.register<JavaExec>("mcgatewayPersonSummaryProbeProof") {
              dependsOn(mcgatewayProof.classesTaskName)
              classpath = mcgatewayProof.runtimeClasspath
              mainClass.set("com.rtm516.mcxboxbroadcast.core.McgatewayXboxPersonSummaryProbeV160Test")
              maxHeapSize = "128m"
          }
          EOF
          grep -Fq 'friends remove is DENIED' upstream/bootstrap/standalone/src/main/java/com/rtm516/mcxboxbroadcast/bootstrap/standalone/StandaloneLoggerImpl.java
          ! grep -Fq 'McgatewayXboxPersonSummaryProbeV160' upstream/bootstrap/standalone/src/main/java/com/rtm516/mcxboxbroadcast/bootstrap/standalone/StandaloneLoggerImpl.java
      - name: Compile exact Release160 source with Gson and run fake GET tests
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g \
            :core:mcgatewayPersonSummaryProbeProof
      - name: Confirm no live console, token export or Xbox DELETE
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'McgatewayXboxPersonSummaryProbeV160' upstream/core/src/main/java/com/rtm516/mcxboxbroadcast/core/FriendManager.java
          ! grep -Fq '.DELETE()' overlay/tools/release160/McgatewayXboxPersonSummaryProbeV160.java
          ! grep -Fq 'dumpsession' overlay/tools/release160/McgatewayXboxPersonSummaryProbeV160.java
          echo "Exact upstream compile and mocked parser tests only; no production network or image publish."
